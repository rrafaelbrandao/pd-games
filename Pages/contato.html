<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Styles/style.css">
    <!-- Links das Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Título -->
    <title>PD Games | Contato</title>
</head>
<body>
     <!-- Cabeçalho com Navegação -->
    <header class="main-header">
        <!-- Container da Logo -->
        <div class="logo-container">
            <img class="pd-logo" src="/Assets/pd-games-logo-atual.png" alt="PD Games - Logo">
        </div>

        <!-- Menu de navegação -->
        <nav class="main-nav">
            <ul>
                <li><a class="link-style montserrat-textos" href="/index.html">Home</a></li>
                <li><a class="link-style montserrat-textos" href="sobre-a-empresa.html">Sobre</a></li>
                <li><a class="link-style montserrat-textos" href="produtos.html">Produtos</a></li>
                <li><a class="link-style montserrat-textos" href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

     <!-- Conteúdo principal --> 
    <main>
        <h1 class="contact-title cinzel-titulos">Contato e Oportunidades</h1>

        <section class="contact-info">

            <div class="contact-info__address">
                <span class="montserrat-textos">Localização | 📍</span>
                <span class="montserrat-textos">Rua Jogos Legais, 107</span>
            </div>

            <div class="contact-info__email">
                <span class="montserrat-textos">Email | ✉️</span>
                <span class="montserrat-textos">suporte@pdgs.com</span>
            </div>

            <div class="contact-info__opening-hours">
                <span class="montserrat-textos">Suporte | ⏰</span>
                <span class="montserrat-textos">24h Online</span>
            </div>

        </section>

        <section class="contact-card">
            
            <h2 class="cinzel-titulos">Envie sua mensagem para o nosso time:</h2>
            
            <form action="">

                <!-- Nome -->
                <div class="contact-card__row">
                    <label for="nome" class="montserrat-textos">Nome Completo:</label>
                    <input type="text" name="" id="nome">
                </div>

                <!-- E-mail -->
                 <div class="contact-card__row">
                    <label for="email" class="montserrat-textos">E-mail de contato:</label>
                    <input type="email" name="" id="email">
                 </div>
                
                <!-- Mensagem -->
                 <div class="contact-card__row">
                    <label for="mensagem" class="montserrat-textos">Sua mensagem:</label>
                    <textarea name="" id="mensagem"></textarea>
                 </div>

                <!-- Botão de envio -->
                <button type="submit" class="montserrat-textos">Enviar mensagem</button>
            
            </form>

        </section>

    </main>
    <footer class="main-footer">
        <div class="footer-content">
            <p class="montserrat-textos">&copy; 2026 PD Games. Todos os direitos reservados.</p>
            <p class="montserrat-textos">Contato: contato@pdgames.com.br</p>
        </div>
    </footer>
</body>
</html>
